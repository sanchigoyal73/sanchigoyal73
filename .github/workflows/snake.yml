name: Profile art

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1A0B0E&color_dots=#F3E6E1,#F7B9C0,#F58A97,#F45D6E,#C9283E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFF1EA&color_dots=#24161A,#5C1E28,#93263A,#C92E45,#FA374E

      - name: Isometric calendar
        run: python3 scripts/isocal.py ${{ github.repository_owner }} dist/isocal.svg

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
