<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 230" width="470" height="230" role="img" aria-label="Pinned repo hallucination-hunter: Audits AI answers against a source: checks every sentence and gives a verdict with a confidence score.">
  <style>
    .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre}
    .s{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .f{font-family:Georgia,'Times New Roman',serif}
    .j{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif}
    .ln{opacity:0;animation:in .5s ease-out forwards}
    .fill{animation:fill 2.6s 1s cubic-bezier(.2,.7,.2,1) both}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes in{from{opacity:0}to{opacity:1}}
    @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}.fill,.cur{animation:none}}
  </style>
  <rect width="470" height="230" rx="8" fill="#1A0B0E"/>
  <rect x="0" y="0" width="470" height="54" rx="8" fill="#FA374E"/><rect x="0" y="40" width="470" height="14" fill="#FA374E"/>
  <text x="20" y="35" fill="#1A0B0E" font-size="12" font-weight="800" class="s" letter-spacing="2">FILE 03</text>
  <text x="450" y="35" fill="#1A0B0E" font-size="14" text-anchor="end" font-weight="700" class="j">ハンター</text>
  <text x="20" y="96" fill="#FFF1EA" font-size="22" font-weight="800" class="s ln" style="animation-delay:0.10s" letter-spacing="-.5">hallucination-hunter</text>
  <text x="20" y="124" fill="#FFF1EA" font-size="12.5" class="s ln" style="animation-delay:0.20s" opacity=".8">Audits AI answers against a source: checks every sentence</text>
  <text x="20" y="142" fill="#FFF1EA" font-size="12.5" class="s ln" style="animation-delay:0.28s" opacity=".8">and gives a verdict with a confidence score.</text>
  <path d="M20 184H450" stroke="#FFF1EA" stroke-opacity=".25"/>
  <path d="M20 210l7.7 -14h8l-7.7 14z" fill="#FA374E"/><path d="M34 210l7.7 -14h8l-7.7 14z" fill="#FA374E"/><path d="M48 210l7.7 -14h8l-7.7 14z" fill="#FA374E"/>
  <text x="78" y="208" fill="#FFF1EA" font-size="12" font-weight="700" class="s">Python · FastAPI · React</text>
  <text x="450" y="208" fill="#FA374E" font-size="12" text-anchor="end" font-weight="800" class="s">open file →</text>
</svg>
