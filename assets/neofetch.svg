<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Sanchi&#x27;s tech stack, neofetch style">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="318" y1="100" x2="900" y2="330">
      <stop offset="0" stop-color="#FFE45C"/><stop offset=".5" stop-color="#FFB13B"/><stop offset="1" stop-color="#6CCFF6"/>
    </linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/><stop offset=".55" stop-color="#FFB13B"/><stop offset="1" stop-color="#6CCFF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#fff" opacity=".022"/></pattern>
  </defs>
  <style>
    .t{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre}
    .ln{opacity:0;animation:in .35s ease-out forwards}
    .blk{fill:url(#g)}
    .sh{fill:none;stroke:#6CCFF6;stroke-width:1.3;opacity:.55}
    .key{opacity:0;animation:press 4s infinite}
    @keyframes press{0%{opacity:0}4%,30%{opacity:1}40%,100%{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}
    .glow{filter:url(#glow)}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}.cur{animation:none}}
  </style>
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0D1117" stroke="#1F2A36" stroke-width="2"/>
