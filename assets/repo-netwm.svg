<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 210" width="470" height="210" role="img" aria-label="Pinned repo NetWM: Forecasts network attacks with a world model before they land. SIH 2026, I built the feature pipeline.">
  <defs>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="460" y2="0">
      <stop offset="0" stop-color="#7CF3C8"/><stop offset=".6" stop-color="#B69CFF"/><stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CF3C8" stop-opacity="0"/><stop offset="1" stop-color="#7CF3C8" stop-opacity=".22"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanl" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#fff" opacity=".035"/></pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern>
    
  </defs>
  <style>
    .t{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre}
    .ln{opacity:0;animation:in .4s ease-out forwards}
    .cur{animation:blink 1s steps(1) infinite}
    .scan{animation:scan 4.5s linear infinite}
    .flick{animation:flick 6s 3s infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--h,340px))}}
    @keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.2}94%{opacity:1}96%{opacity:.4}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}.cur,.scan,.flick,.pulse{animation:none}}
  </style>
  <rect x="1" y="1" width="468" height="208" rx="6" fill="#07090C" stroke="#1C2630" stroke-width="2"/>
  <rect x="1" y="1" width="468" height="208" rx="6" fill="url(#grid)"/>
  <rect x="10" y="10" width="450" height="190" fill="#0C1117"/>
  <path d="M10 22V10H22M448 10H460V22M460 188V200H448M22 200H10V188" fill="none" stroke="#FFC857" stroke-width="2"/>
  <rect x="24" y="24" width="88" height="18" fill="#FFC857"/>
  <text x="32" y="37" fill="#07090C" font-size="10.5" font-weight="700" class="t">MISSION 04</text>
  <text x="446" y="37" fill="#FFC857" font-size="12" text-anchor="end" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif" class="t">ネットワーク</text>
  <text x="24" y="76" fill="#D7E3EA" font-size="22" font-weight="700" class="t ln" style="animation-delay:0.10s">NetWM</text>
  <text x="24" y="104" fill="#9FB0BD" font-size="12" class="t ln" style="animation-delay:0.25s">Forecasts network attacks with a world model before</text>
  <text x="24" y="122" fill="#9FB0BD" font-size="12" class="t ln" style="animation-delay:0.35s">they land. SIH 2026, I built the feature pipeline.</text>
  <path d="M24 162H446" stroke="#1C2630"/>
  <circle cx="30" cy="180" r="5" fill="#FFC857" class="pulse"/>
  <text x="42" y="184" fill="#D7E3EA" font-size="11.5" class="t">Python · PyTorch</text>
  <text x="446" y="184" fill="#FFC857" font-size="11.5" text-anchor="end" font-weight="700" class="t">OPEN FILE &gt;</text>
  <rect x="1" y="1" width="468" height="208" rx="6" fill="url(#scanl)" pointer-events="none"/>
</svg>
