<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="How a project moves: 01 brief, 02 references, 03 build with Next.js, React and TypeScript, 04 motion, API and ML layers, 05 ship on Vercel with GitHub Actions">
