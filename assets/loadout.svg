<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Loadout: TypeScript, JavaScript, Python, C++; React, Next.js, Vite, Tailwind, shadcn; Three.js, GSAP, Framer Motion; Node.js, Express, FastAPI; PyTorch, scikit-learn, pandas, SHAP; Claude API; Git, GitHub Actions, Vercel, Vitest">
  <defs>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="460" y2="0">
      <stop offset="0" stop-color="#7CF3C8"/><stop offset=".6" stop-color="#B69CFF"/><stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CF3C8" stop-opacity="0"/><stop offset="1" stop-color="#7CF3C8" stop-opacity=".22"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanl" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#fff" opacity=".035"/></pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern>
    
  </defs>
  <style>
    .t{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre}
    .ln{opacity:0;animation:in .4s ease-out forwards}
    .cur{animation:blink 1s steps(1) infinite}
    .scan{animation:scan 4.5s linear infinite}
    .flick{animation:flick 6s 3s infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--h,340px))}}
    @keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.2}94%{opacity:1}96%{opacity:.4}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}.cur,.scan,.flick,.pulse{animation:none}}
  </style>
  <rect x="1" y="1" width="958" height="428" rx="6" fill="#07090C" stroke="#1C2630" stroke-width="2"/>
