<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Animated ASCII mascot: a little robot with a lightning bolt">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="0.55" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#6CCFF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:17px;white-space:pre}
    .art{fill:url(#g);filter:url(#glow)}
    .ln{opacity:0;animation:in .25s ease-out forwards}
    .bolt{animation:in .25s ease-out forwards, flick 3.2s 2.2s infinite}
    .dim{fill:#5B6B7C}
    .ok{fill:#7BE0A0}
    .cy{fill:#6CCFF6}
    .cur{animation:blink 1s steps(1) infinite}
    .eye{animation:look 5s 2.4s infinite}
    @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    @keyframes flick{0%,86%,100%{opacity:1}88%{opacity:.15}90%{opacity:1}92%{opacity:.3}94%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes look{0%,40%,100%{transform:none}45%,60%{transform:translateX(5px)}65%,80%{transform:translateX(-5px)}}
  </style>

  <!-- terminal window -->
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#0D1117" stroke="#1F2A36" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="398" rx="14" fill="url(#scan)"/>
  <circle cx="26" cy="24" r="6" fill="#FF6B5B"/><circle cx="46" cy="24" r="6" fill="#FFB13B"/><circle cx="66" cy="24" r="6" fill="#7BE0A0"/>
  <text x="380" y="29" text-anchor="middle" class="t dim" style="font-size:13px">~/voltbot — zsh</text>

  <!-- the mascot -->
  <g class="t art">
    <text x="40" y="78"  class="ln bolt" style="animation-delay:.10s">            __</text>
    <text x="40" y="99"  class="ln bolt" style="animation-delay:.20s">           / /</text>
    <text x="40" y="120" class="ln bolt" style="animation-delay:.30s">          / /__</text>
    <text x="40" y="141" class="ln bolt" style="animation-delay:.40s">         /__  /</text>
    <text x="40" y="162" class="ln bolt" style="animation-delay:.50s">           / /</text>
    <text x="40" y="183" class="ln bolt" style="animation-delay:.60s">          /_/</text>
    <text x="40" y="204" class="ln" style="animation-delay:.70s">     .-----------.</text>
    <text x="40" y="225" class="ln" style="animation-delay:.80s">    /  ___   ___  \</text>
    <g class="eye"><text x="40" y="246" class="ln" style="animation-delay:.90s">   |  | o | | o |  |</text></g>
    <text x="40" y="267" class="ln" style="animation-delay:1.00s">   |  '---' '---'  |</text>
    <text x="40" y="288" class="ln" style="animation-delay:1.10s">   |    \_____/    |</text>
    <text x="40" y="309" class="ln" style="animation-delay:1.20s">    \_____________/</text>
    <text x="40" y="330" class="ln" style="animation-delay:1.30s">      |  |   |  |</text>
    <text x="40" y="351" class="ln" style="animation-delay:1.40s">     _|__|___|__|_</text>
  </g>

  <!-- boot log on the right -->
  <g class="t" style="font-size:15px">
    <text x="330" y="96"  class="ln dim" style="animation-delay:1.6s">$ ./voltbot --boot</text>
    <text x="330" y="126" class="ln" style="animation-delay:1.9s"><tspan class="ok">✓</tspan><tspan fill="#C9D4DF"> charging capacitors</tspan></text>
    <text x="330" y="151" class="ln" style="animation-delay:2.2s"><tspan class="ok">✓</tspan><tspan fill="#C9D4DF"> loading coffee.dll</tspan></text>
    <text x="330" y="176" class="ln" style="animation-delay:2.5s"><tspan class="ok">✓</tspan><tspan fill="#C9D4DF"> compiling ideas</tspan></text>
    <text x="330" y="201" class="ln" style="animation-delay:2.8s"><tspan class="ok">✓</tspan><tspan fill="#C9D4DF"> shipping commits</tspan></text>
    <text x="330" y="246" class="ln cy" style="animation-delay:3.2s;font-size:22px;font-weight:700">SANCHI GOYAL</text>
    <text x="330" y="274" class="ln dim" style="animation-delay:3.4s">developer · builder · tinkerer</text>
    <text x="330" y="330" class="ln" style="animation-delay:3.7s"><tspan fill="#FFB13B">&gt;</tspan><tspan fill="#C9D4DF"> status: </tspan><tspan class="ok">fully charged</tspan><tspan class="cur" fill="#C9D4DF"> █</tspan></text>
  </g>
</svg>
